{% extends "base.html" %}
{% block body_class %}signup{% endblock %}
{% block content %}
<div class="center-pane form-card form-card-small">
    <span class="section-lead">{{ section_lead }}</span>
    <h2>{{ heading }}</h2>
    <p>{{ description }}</p>
    <form method="POST" class="form-grid">
        <input class="form-field" type="text" name="full_name" placeholder="Full Name" required>
        <input class="form-field" type="text" name="phone" placeholder="Phone Number" required>
        <input class="form-field" type="text" name="username" placeholder="Username" required>
        <input class="form-field" type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary">{{ submit_text }}</button>
    </form>
    <div class="footer-links centered-footer">
        <a href="{{ url_for('login') }}">Already have an account? Login</a>
        <a href="{{ url_for('home') }}">Back to Home</a>
    </div>
</div>
{% endblock %}
