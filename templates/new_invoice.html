<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Invoice - Brilliant Driving School</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h2 { color: #1e3a8a; text-align: center; }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background: #1e3a8a;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #2c5282; }
    </style>
</head>
<body>
    <div class="container">
        {% extends "base.html" %}
{% block content %}
<h2>New Payment Invoice</h2>
<form method="POST">
    <input type="text" name="student_name" placeholder="Student Full Name" required><br>
    
    <select name="course" required>
        <option value="">Select Course</option>
        <option value="Basic">Basic</option>
        <option value="HGV">Heavy Goods Vehicles (HGV)</option>
        <option value="PSV">Public Service Vehicles (PSV)</option>
    </select><br>
    
    <input type="text" name="payment_type" placeholder="Payment Type (e.g. Registration Fees)" required><br>
    <input type="number" name="amount" placeholder="Amount (TSh)" required><br>
    
    <button type="submit">Generate Invoice</button>
</form>
{% endblock %}
        <br>
        <a href="{{ url_for('dashboard') }}">← Back to Dashboard</a>
    </div>
</body>
</html>
