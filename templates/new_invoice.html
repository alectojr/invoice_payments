{% extends "base.html" %}   <!-- If you have base, otherwise use full html -->
<h2>New Payment Invoice</h2>
<form method="POST">
    <input type="text" name="student_name" placeholder="Student Full Name" required><br>
    <select name="course" required>
        <option value="">Select Course</option>
        <option value="Basic">Basic</option>
        <option value="HGV">Heavy Goods Vehicles (HGV)</option>
        <option value="PSV">Public Service Vehicles (PSV)</option>
    </select><br>
    <input type="text" name="payment_type" placeholder="Payment Type e.g. Registration Fees" required><br>
    <input type="number" name="amount" placeholder="Amount in TSh" required><br>
    <button type="submit">Generate Invoice</button>
</form>
