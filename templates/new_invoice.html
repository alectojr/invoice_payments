{% extends "base.html" %}
{% block body_class %}page-form{% endblock %}
{% block content %}
<div class="hero-card page-panel">
    <h2>New Invoice</h2>
    <form method="POST">
        <select class="form-field" name="student_id" required>
            <option value="">Select Student</option>
            {% for student in students %}
            <option value="{{ student.id }}">{{ student.registration_number }} - {{ student.full_name }}</option>
            {% endfor %}
        </select>
        
        <select class="form-field" name="payment_type" required>
            <option value="">Select Payment Type</option>
            <option value="Refresher 1 Week">Refresher 1 Week (100,000 TSh)</option>
            <option value="Refresher 2 Weeks">Refresher 2 Weeks (150,000 TSh)</option>
            <option value="Full Course">Full Course</option>
        </select>
        
        <div class="button-row">
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Generate Invoice</button>
        </div>
    </form>
</div>
{% endblock %}
