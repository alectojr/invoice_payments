{% extends "base.html" %}
{% block content %}
<h2 style="text-align:center; color:var(--primary);">Student Registration</h2>

<form method="POST" enctype="multipart/form-data" class="grid grid-2">
    <div>
        <p><strong>Full Name</strong></p>
        <input type="text" name="full_name" required placeholder="Enter full name">

        <p><strong>Email Address</strong></p>
        <input type="email" name="email" placeholder="your@email.com">

        <p><strong>Phone Number</strong></p>
        <input type="text" name="phone" required placeholder="+255 XXX XXX XXX">
    </div>

    <div>
        <p><strong>Course</strong></p>
        <select name="course" required>
            <option value="">Select Course</option>
            <option value="Basic Driving">Basic Driving Course</option>
            <option value="HGV">Heavy Goods Vehicle (HGV)</option>
            <option value="PSV">Public Service Vehicle (PSV)</option>
            <option value="Refresher">Refresher Course</option>
        </select>

        <p><strong>Student Photo (Optional)</strong></p>
        <input type="file" name="photo" accept="image/*">
    </div>

    <div style="grid-column: 1 / -1;">
        <button type="submit" class="btn btn-primary" style="width:100%; padding:16px; font-size:1.1rem;">
            Complete Registration
        </button>
    </div>
</form>

<p style="text-align:center; margin-top:25px;">
    Already registered? <a href="{{ url_for('login') }}">Login Here</a>
</p>
{% endblock %}
