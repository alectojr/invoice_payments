{% extends "base.html" %}
{% block content %}
<h2>New Payment Invoice</h2>
<form method="POST">
    <p><strong>Student Name:</strong></p>
    <input type="text" name="student_name" required style="width:100%; padding:10px; margin-bottom:15px;">

    <p><strong>Course:</strong></p>
    <input type="text" name="course" required style="width:100%; padding:10px; margin-bottom:15px;">

    <p><strong>Payment Type:</strong></p>
    <input type="text" name="payment_type" placeholder="e.g. Full Course, Refresher" required style="width:100%; padding:10px; margin-bottom:15px;">

    <p><strong>Amount (TSh):</strong></p>
    <input type="number" name="amount" required style="width:100%; padding:10px; margin-bottom:15px;">

    <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;">Generate Invoice</button>
</form>

<a href="{{ url_for('dashboard') }}" class="btn">← Back to Dashboard</a>
{% endblock %}
