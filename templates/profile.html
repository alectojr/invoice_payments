{% extends "base.html" %}
{% block body_class %}page-form{% endblock %}
{% block content %}
<div class="hero-card page-panel">
    <div class="center-pane">
        <span class="section-lead">Profile</span>
        <h2>Manage Your Profile</h2>
        <p>Update your contact details, PCI information, and profile notes.</p>
    </div>
    <form method="POST" class="form-grid form-spacing">
        <div class="form-field-group">
            <label class="form-label">Username</label>
            <input class="form-field" type="text" value="{{ user.username }}" readonly>
        </div>
        <div class="form-field-group">
            <label class="form-label">Full Name</label>
            <input class="form-field" type="text" name="full_name" value="{{ user.full_name or '' }}">
        </div>
        <div class="form-field-group">
            <label class="form-label">Phone</label>
            <input class="form-field" type="text" name="phone" value="{{ user.phone or '' }}">
        </div>
        {% if user_type == 'admin' %}
        <div class="form-field-group">
            <label class="form-label">PCI Info</label>
            <input class="form-field" type="text" name="pci_info" value="{{ user.pci_info or '' }}" placeholder="PCI or profile credentials">
        </div>
        <div class="form-field-group">
            <label class="form-label">Profile Notes</label>
            <textarea class="form-field" name="profile_notes" rows="4" placeholder="Additional profile details">{{ user.profile_notes or '' }}</textarea>
        </div>
        {% else %}
        <input type="hidden" name="pci_info" value="{{ user.pci_info or '' }}">
        <input type="hidden" name="profile_notes" value="{{ user.profile_notes or '' }}">
        {% endif %}
        <div class="button-row button-row-space">
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Profile</button>
        </div>
    </form>
</div>
{% endblock %}
