{% extends "base.html" %}
{% block body_class %}page-form{% endblock %}
{% block content %}
<div class="hero-card page-panel">
    <div class="center-pane">
        <span class="section-lead">Add Payment</span>
        <h2>Add Payment for {{ existing_payment.student_name }}</h2>
        <p>Add an additional payment for this student's {{ existing_payment.course }} course.</p>
    </div>
    <form method="POST" class="form-grid form-spacing">
        <div class="form-field-group">
            <label class="form-label">Student Name</label>
            <input class="form-field" type="text" value="{{ existing_payment.student_name }}" readonly>
        </div>
        <div class="form-field-group">
            <label class="form-label">Course</label>
            <input class="form-field" type="text" value="{{ existing_payment.course }}" readonly>
        </div>
        <div class="form-field-group">
            <label class="form-label">Payment Type</label>
            <select class="form-field" name="payment_type" required>
                <option value="">Select Payment Type</option>
                <option value="Refresher 1 Week">Refresher 1 Week - TSh 100,000</option>
                <option value="Refresher 2 Weeks">Refresher 2 Weeks - TSh 150,000</option>
                <option value="Full Course">Full Course - TSh {{ "250,000" if existing_payment.course != "HGV" else "350,000" }}</option>
            </select>
        </div>
        <div class="button-row button-row-space">
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Add Payment</button>
        </div>
    </form>
</div>

<style>
.form-field-group {
    margin-bottom: 20px;
}

.form-label {
    display: block;
    font-weight: bold;
    color: #374151;
    margin-bottom: 8px;
}

.form-field[readonly] {
    background-color: #f3f4f6;
    cursor: not-allowed;
}
</style>
{% endblock %}
