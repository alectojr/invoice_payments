{% extends "base.html" %}
{% block body_class %}page-form{% endblock %}
{% block content %}
<div class="hero-card page-panel">
    <div class="center-pane">
        <span class="section-lead">{{ translate('change_password') }}</span>
        <h2>Set New Password</h2>
        <p>Please set a new password for your account.</p>
    </div>
    <form method="POST" class="form-grid form-spacing">
        <div class="form-field-group">
            <label class="form-label">{{ translate('new_password') }}</label>
            <input class="form-field" type="password" name="new_password" required>
        </div>
        <div class="form-field-group">
            <label class="form-label">{{ translate('confirm_password') }}</label>
            <input class="form-field" type="password" name="confirm_password" required>
        </div>
        <div class="button-row">
            <button type="submit" class="btn btn-primary">{{ translate('submit') }}</button>
        </div>
    </form>
</div>
{% endblock %}
