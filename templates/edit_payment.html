{% extends "base.html" %}
{% block body_class %}page-form{% endblock %}
{% block content %}
<div class="hero-card page-panel">
    <div class="center-pane">
        <span class="section-lead">Edit Payment</span>
        <h2>Edit {{ payment.invoice_no }}</h2>
        <p>Update the invoice details carefully before saving.</p>
    </div>
    <form method="POST" class="form-grid form-spacing">
        <input class="form-field" type="text" name="student_name" value="{{ payment.student_name }}" required>
        <select class="form-field" name="course" required>
            <option value="Basic" {% if payment.course == 'Basic' %}selected{% endif %}>Basic</option>
            <option value="HGV" {% if payment.course == 'HGV' %}selected{% endif %}>HGV</option>
            <option value="PSV" {% if payment.course == 'PSV' %}selected{% endif %}>PSV</option>
        </select>
        <input class="form-field" type="text" name="payment_type" value="{{ payment.payment_type }}" required>
        <input class="form-field" type="number" name="amount" value="{{ payment.amount }}" required>
        <div class="button-row button-row-space">
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Update Payment</button>
        </div>
    </form>
</div>
{% endblock %}
