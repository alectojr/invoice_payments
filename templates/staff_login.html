{% extends "base.html" %}
{% block body_class %}login{% endblock %}
{% block content %}
<div class="hero-card">
    <div class="center-pane">
        <span class="section-lead">{{ translate('staff_login') }}</span>
        <h2>Staff Login</h2>
        <p>Access the staff dashboard for Brilliant Driving School.</p>
    </div>
    <form method="POST" class="form-grid">
        <div class="form-field-group">
            <label class="form-label">Username</label>
            <input class="form-field" type="text" name="username" required>
        </div>
        <div class="form-field-group">
            <label class="form-label">Password</label>
            <input class="form-field" type="password" name="password" required>
        </div>
        <div class="button-row">
            <a href="{{ url_for('login') }}" class="btn btn-secondary">{{ translate('login') }}</a>
            <button type="submit" class="btn btn-primary">{{ translate('staff_login') }}</button>
        </div>
        <div class="form-footer">
            <p>Don't have an account? <a href="{{ url_for('staff_signup') }}">Sign up here</a></p>
        </div>
    </form>
</div>
{% endblock %}
