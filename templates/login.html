<!DOCTYPE html>
<html>
<head>
    <title>Login - Brilliant Driving School</title>
    <style>
        body { font-family: Arial; background: #1e3a8a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 15px; width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #1e3a8a; color: white; border: none; border-radius: 5px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Brilliant Driving School</h2>
        <h3>Admin Login</h3>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
